version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: infraflow_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infraflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-infraflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infraflow_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infraflow_user} -d ${POSTGRES_DB:-infraflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infraflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infraflow_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-infraflow-development-secret-key-change-in-production-2026}
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://${POSTGRES_USER:-infraflow_user}:${POSTGRES_PASSWORD:-infraflow_password}@postgres:5432/${POSTGRES_DB:-infraflow_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infraflow_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-infraflow-development-secret-key-change-in-production-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-infraflow_user}:${POSTGRES_PASSWORD:-infraflow_password}@postgres:5432/${POSTGRES_DB:-infraflow_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infraflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
