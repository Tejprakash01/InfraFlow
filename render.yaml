services:
  # Django REST Backend Service
  - type: web
    name: infraflow-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: infraflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: infraflow-redis
          property: connectionString

  # React Frontend Static Site / Web Service
  - type: web
    name: infraflow-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://infraflow-backend.onrender.com/api/v1

databases:
  # Managed PostgreSQL Database
  - name: infraflow-db
    databaseName: infraflow
    user: infraflow_user
    plan: free
